name: Set up Google Cloud
description: >-
  Signs in as the deployer service account through Workload Identity
  Federation (no keys) and installs gcloud. Reads WIF_PROVIDER, DEPLOYER_SA,
  CLOUDSDK_CORE_PROJECT and REGION from the workflow env.

inputs:
  docker:
    description: Also let Docker push to Artifact Registry
    default: "false"

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOYER_SA }}

    - uses: google-github-actions/setup-gcloud@v3

    - if: inputs.docker == 'true'
      shell: bash
      run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
