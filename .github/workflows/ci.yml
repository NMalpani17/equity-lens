name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client (lint · typecheck · test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  api:
    name: api (lint · typecheck · test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  ai-service:
    name: ai-service (lint · test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Everything that needs a real database, against a throwaway Postgres 17
  # (Supabase runs 17): migrations apply cleanly and match schema.prisma, RLS
  # covers every table, backup-db.sh / restore-db.sh round-trip every row, the
  # api's queries run for real, and the ai-service's repository SQL (RAG and
  # reports) passes its Postgres tests.
  backup-roundtrip:
    name: migrations · RLS · backup round trip · api + repository SQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - uses: ./.github/actions/setup-pg-client
      - run: .github/scripts/ci/backup-roundtrip.sh
      # The api's real-database tests (raw SQL, advisory locks, transactions),
      # which the unit tests can't catch because they mock Prisma.
      - name: api integration tests (real Prisma queries)
        run: .github/scripts/ci/api-integration.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      # Each test applies its migrations into a fresh schema and drops it.
      # 127.0.0.1, not localhost, so the client never tries IPv6 first.
      - name: Repository SQL (Postgres-gated tests)
        working-directory: ai-service
        env:
          AI_SERVICE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?connect_timeout=10
        # Fail rather than pass if the tests were skipped (no database URL).
        run: |
          set -o pipefail
          tests=(tests/test_rag_repository_pg.py tests/test_report_repository_pg.py)
          pytest -p no:cacheprovider -rs "${tests[@]}" | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::Postgres-gated tests were skipped."
            exit 1
          fi
